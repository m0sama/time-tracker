<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750A4">
  <title>Time Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-app-bar">
    <span class="title-large">Time Tracker</span>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" type="button" aria-label="Add work entry">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <dialog id="entry-dialog" aria-labelledby="entry-title">
    <form id="entry-form">
      <h2 id="entry-title" class="headline-small">Add work entry</h2>

      <div class="outlined-field always-float">
        <select id="entry-project" required></select>
        <label for="entry-project">Project</label>
      </div>

      <div class="outlined-field always-float">
        <button id="entry-date-button" type="button" class="date-button" aria-haspopup="true" aria-expanded="false"></button>
        <label for="entry-date-button">Date</label>
        <input id="entry-date" type="hidden">
      </div>

      <div id="calendar" class="calendar" hidden>
        <div class="calendar-header">
          <button id="cal-prev" type="button" class="icon-button" aria-label="Previous month">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <strong id="cal-title" class="title-medium" aria-live="polite"></strong>
          <button id="cal-next" type="button" class="icon-button" aria-label="Next month">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div id="cal-grid" class="calendar-grid"></div>
      </div>

      <div class="hours-row">
        <div class="outlined-field hours-field">
          <input id="entry-hours" type="number" min="0.25" max="24" step="0.25" inputmode="decimal" placeholder=" " required>
          <label for="entry-hours">Hours worked</label>
        </div>
        <div class="stepper-buttons">
          <button id="hours-minus" type="button" class="icon-button tonal" aria-label="Decrease by 15 minutes">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13H5v-2h14v2z"/></svg>
          </button>
          <button id="hours-plus" type="button" class="icon-button tonal" aria-label="Increase by 15 minutes">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
      </div>

      <div class="outlined-field">
        <input id="entry-note" type="text" maxlength="200" placeholder=" ">
        <label for="entry-note">Note (optional)</label>
      </div>

      <div id="entry-conflict" class="conflict" hidden>
        <p class="body-medium">
          This project already has <span id="conflict-hours" class="title-small"></span> logged on this day.
          Update that entry instead of adding a second one.
        </p>
        <button id="entry-conflict-edit" type="button" class="text-button">Edit that entry</button>
      </div>

      <p id="entry-error" class="error-text" role="alert"></p>

      <div class="dialog-actions">
        <button id="entry-delete" type="button" class="text-button danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button id="entry-cancel" type="button" class="text-button">Cancel</button>
        <button id="entry-save" type="submit" class="filled-button">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title" class="headline-small"></h2>
    <p id="confirm-message" class="body-medium variant"></p>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button id="confirm-cancel" type="button" class="text-button">Cancel</button>
      <button id="confirm-ok" type="button" class="filled-button danger">Delete</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
